[package]
name = "rustcom"
version = "0.1.0"
description = "RustCOM serial-port analyzer"
authors = ["RustCOM"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rustcom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serialport = "4.5"
chrono = "0.4"
thiserror = "1"
parking_lot = "0.12"
dirs = "5"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
